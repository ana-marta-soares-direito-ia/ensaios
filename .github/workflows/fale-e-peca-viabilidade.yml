name: Fale e Peça (viabilidade)
on:
  workflow_dispatch:
jobs:
  navegador:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        run: cd fale-e-peca/viabilidade && npm init -y >/dev/null && npm i --no-audit --no-fund playwright >/dev/null && npx playwright install chromium >/dev/null
      - shell: bash
        run: cd fale-e-peca/viabilidade && node navegador.js
