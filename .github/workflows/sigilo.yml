name: Sigilo
on:
  push:
    branches: [main]
    paths: ['sigilo/pacote.bin']
permissions:
  contents: write
jobs:
  ensaio:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: linux, os: ubuntu-latest }
          - { nome: windows, os: windows-latest }
          - { nome: mac, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Receber o pacote
        run: |
          R="chave-${{ github.run_id }}-${{ matrix.nome }}"
          git config user.name "maquina de ensaio"; git config user.email "noreply@github.com"
          git checkout -q -b "$R"; mkdir -p chaves; node sigilo/chave.js gerar "chaves/$R.pub"
          git add chaves; git commit -q -m "chave publica da maquina $R"; git push -q origin "$R"
          for i in $(seq 1 120); do git fetch -q origin "$R" && git reset -q --hard "origin/$R"; [ -f "chaves/$R.enc" ] && break; sleep 10; done
          [ -f "chaves/$R.enc" ] || { echo "A chave do pacote não chegou."; exit 1; }
          node sigilo/chave.js abrir "chaves/$R.enc" sigilo/pacote.bin "$RUNNER_TEMP/pacote.zip"
          mkdir -p "$RUNNER_TEMP/p"; cd "$RUNNER_TEMP/p"; unzip -q "$RUNNER_TEMP/pacote.zip"; rm -f "$RUNNER_TEMP/pacote.zip"; mkdir c; unzip -q sigilo-1.4.0.zip -d c; unzip -qo sigilo-leitura-1.4.0.zip -d c
      - name: Navegador
        run: |
          mkdir -p "$RUNNER_TEMP/pw"; cd "$RUNNER_TEMP/pw"; npm init -y >/dev/null; npm install --no-audit --no-fund playwright >/dev/null
          if [ "${{ matrix.nome }}" = "linux" ]; then npx playwright install --with-deps chromium >/dev/null; else npx playwright install chromium >/dev/null; fi
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Ensaio do comprador
        run: node "$RUNNER_TEMP/p/ci/e.js" "$RUNNER_TEMP/p" "${{ matrix.nome }}" 2>&1 | cut -c1-300
      - name: Validador oficial da Microsoft para Word, Excel e PowerPoint
        if: always()
        continue-on-error: true
        run: cd "$RUNNER_TEMP/p/ci/val" && dotnet run -c Release -- "$RUNNER_TEMP/p" 2>&1 | tail -40 | cut -c1-260
      - name: Devolver o resultado
        if: always()
        run: |
          B="resultado-sigilo-${{ github.run_id }}-${{ matrix.nome }}"; git checkout -q --orphan "$B"; git rm -rfq . >/dev/null; cp "$RUNNER_TEMP/p/r.json" r.json 2>/dev/null || echo '{}' > r.json; cp "$RUNNER_TEMP/p/val.json" val.json 2>/dev/null || true
          git add r.json; [ -f val.json ] && git add val.json; git commit -q -m "resultado"; git push -q origin "$B"
