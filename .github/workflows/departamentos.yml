name: Departamentos
on:
  push:
    branches: [main]
    paths: ['departamentos/pacote.bin']
permissions:
  contents: write
jobs:
  ensaio:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: linux, os: ubuntu-latest }
          - { nome: windows, os: windows-latest }
          - { nome: mac, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Receber o pacote
        run: |
          R="chave-${{ github.run_id }}-${{ matrix.nome }}"
          git config user.name "maquina de ensaio"; git config user.email "noreply@github.com"
          git checkout -q -b "$R"; mkdir -p chaves; node nuvem-propria/chave.js gerar "chaves/$R.pub"
          git add chaves; git commit -q -m "chave publica da maquina $R"; git push -q origin "$R"
          for i in $(seq 1 120); do git fetch -q origin "$R" && git reset -q --hard "origin/$R"; [ -f "chaves/$R.enc" ] && break; sleep 10; done
          [ -f "chaves/$R.enc" ] || { echo "A chave do pacote não chegou."; exit 1; }
          node nuvem-propria/chave.js abrir "chaves/$R.enc" departamentos/pacote.bin "$RUNNER_TEMP/pacote.zip"
          mkdir -p "$RUNNER_TEMP/p"; cd "$RUNNER_TEMP/p"; unzip -q "$RUNNER_TEMP/pacote.zip"; rm -f "$RUNNER_TEMP/pacote.zip"
      - name: Ensaio
        run: |
          cd "$RUNNER_TEMP/p"
          if grep -qx "${{ matrix.nome }}" ci/partes.txt; then bash ci/correr.sh ${{ matrix.nome }}; else echo "Esta máquina não entra nesta volta."; fi
