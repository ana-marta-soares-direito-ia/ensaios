name: sonda
on:
  push:
    paths: ["sonda/pedido.txt"]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          N=$(head -1 sonda/pedido.txt); tail -n +2 sonda/pedido.txt | while read -r u; do [ -z "$u" ] && continue; echo "##### $u"; curl -sS -L -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" -H "Accept-Language: pt-PT,pt;q=0.9" -o /tmp/p -w "estado %{http_code} tipo %{content_type} bytes %{size_download}\n" "$u" || echo falhou; (iconv -f "${CS:-windows-1252}" -t utf-8 /tmp/p 2>/dev/null || cat /tmp/p) | tr -s ' \n\t\r' ' ' | head -c "$N"; echo; done
