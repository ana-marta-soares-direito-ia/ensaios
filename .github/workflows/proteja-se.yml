name: Proteja-se
on:
  push:
    branches: [main]
    paths: ['proteja-se/pacote.bin']
permissions:
  contents: write
jobs:
  ensaio:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: linux, os: ubuntu-latest }
          - { nome: windows, os: windows-latest }
          - { nome: mac-apple, os: macos-latest }
          - { nome: mac-intel, os: macos-15-intel }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Receber o pacote
        run: |
          R="chave-${{ github.run_id }}-${{ matrix.nome }}"
          git config user.name "maquina de ensaio"; git config user.email "noreply@github.com"
          git checkout -q -b "$R"; mkdir -p chaves; node proteja-se/chave.js gerar "chaves/$R.pub"
          git add chaves; git commit -q -m "chave publica da maquina $R"; git push -q origin "$R"
          for i in $(seq 1 120); do git fetch -q origin "$R" && git reset -q --hard "origin/$R"; [ -f "chaves/$R.enc" ] && break; sleep 10; done
          [ -f "chaves/$R.enc" ] || { echo "A chave do pacote não chegou."; exit 1; }
          node proteja-se/chave.js abrir "chaves/$R.enc" proteja-se/pacote.bin "$RUNNER_TEMP/pacote.zip"
          mkdir -p "$RUNNER_TEMP/p"; cd "$RUNNER_TEMP/p"; unzip -q "$RUNNER_TEMP/pacote.zip" || tar -xf "$RUNNER_TEMP/pacote.zip"; rm -f "$RUNNER_TEMP/pacote.zip"; ls proteja-se
      - name: Navegador para os ensaios
        run: |
          mkdir -p "$RUNNER_TEMP/pw"; cd "$RUNNER_TEMP/pw"; npm init -y >/dev/null; npm install --no-audit --no-fund playwright >/dev/null
          if [ "${{ matrix.nome }}" = "linux" ]; then npx playwright install --with-deps chromium >/dev/null; else npx playwright install chromium >/dev/null; fi
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"; mkdir -p "$RUNNER_TEMP/p/proteja-se/r"
      - name: LibreOffice (para os formatos antigos)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ "${{ matrix.nome }}" = "linux" ]; then sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq libreoffice-writer libreoffice-calc libreoffice-impress >/dev/null
          elif [ "${{ matrix.nome }}" = "windows" ]; then choco install libreoffice-fresh -y --no-progress >/dev/null
          elif [ "${{ matrix.nome }}" = "mac-apple" ]; then brew install --cask libreoffice >/dev/null 2>&1; fi
          echo "feito"
      - name: Regras de detecção
        if: always()
        run: cd "$RUNNER_TEMP/p/proteja-se" && node testes.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-600
      - name: Ficheiros difíceis
        if: always()
        run: cd "$RUNNER_TEMP/p/proteja-se" && RESULTADO=r/dificeis.json node ensaios/ensaio-dificeis.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-900
      - name: Programa, guardas e painel
        if: always()
        run: cd "$RUNNER_TEMP/p/proteja-se" && RESULTADO=r/programa.json node ensaios/ensaio-programa.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-1500
      - name: Extensão no navegador de ensaio (Chromium)
        if: always()
        run: cd "$RUNNER_TEMP/p/proteja-se" && RESULTADO=r/extensao.json node ensaios/ensaio-extensao.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-900
      - name: Extensão no Chrome
        if: always() && matrix.nome != 'mac-intel'
        continue-on-error: true
        run: cd "$RUNNER_TEMP/p/proteja-se" && NAVEGADOR=chrome RESULTADO=r/extensao-chrome.json node ensaios/ensaio-extensao.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-900
      - name: Extensão no Edge
        if: always() && (matrix.nome == 'windows' || matrix.nome == 'mac-apple')
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/p/proteja-se"
          if [ "${{ matrix.nome }}" = "mac-apple" ]; then brew install --cask microsoft-edge >/dev/null 2>&1 || true; N="/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"; [ -x "$N" ] || N=msedge; else N=msedge; fi
          NAVEGADOR="$N" RESULTADO=r/extensao-edge.json node ensaios/ensaio-extensao.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-900
      - name: Extensão no Brave
        if: always() && (matrix.nome == 'windows' || matrix.nome == 'mac-apple')
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/p/proteja-se"
          if [ "${{ matrix.nome }}" = "mac-apple" ]; then brew install --cask brave-browser >/dev/null 2>&1 || true; N="/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"; else choco install brave -y --no-progress >/dev/null || true; N="C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"; fi
          ls -la "$N" || true
          NAVEGADOR="$N" RESULTADO=r/extensao-brave.json node ensaios/ensaio-extensao.js 2>&1 | grep -v "^Warning\|^Require\|^- " | cut -c1-900
      - name: Janelas de aviso do sistema
        if: always() && matrix.nome != 'linux'
        continue-on-error: true
        run: cd "$RUNNER_TEMP/p/proteja-se" && PROTEJASE_DESISTE=15 RESULTADO=r/janelas.json node ensaios/ensaio-janelas.js r 2>&1 | cut -c1-900
      - name: Aplicações de IA verdadeiras
        if: always() && (matrix.nome == 'windows' || matrix.nome == 'mac-apple')
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cd "$RUNNER_TEMP/p/proteja-se"
          if [ "${{ matrix.nome }}" = "mac-apple" ]; then for c in claude chatgpt cursor lm-studio ollama-app; do brew install --cask $c >/dev/null 2>&1 && echo "instalada: $c" || echo "não instalada: $c"; done
          else for c in Anthropic.Claude Ollama.Ollama Anysphere.Cursor ElementLabs.LMStudio; do timeout 420 winget install --id $c -e --silent --disable-interactivity --accept-package-agreements --accept-source-agreements >/dev/null 2>&1 && echo "instalada: $c" || echo "não instalada: $c"; done; fi
          RESULTADO=r/aplicacoes.json node ensaios/ensaio-aplicacoes.js 2>&1 | cut -c1-900
      - name: Arranque (Mac e Linux)
        if: always() && matrix.nome != 'windows'
        run: |
          cd "$RUNNER_TEMP/p/proteja-se"; S=0
          A=0; PROTEJASE_SEM_NAVEGADOR=1 LICENCA=AMS-errado ./arrancar.sh || A=$?; echo "arranque com licença errada: saída $A (esperado 2)"; [ "$A" = "2" ] || S=1
          B=0; PROTEJASE_NODE_PROPRIO=1 PROTEJASE_SEM_NAVEGADOR=1 LICENCA=AMS-errado ./arrancar.sh || B=$?; echo "arranque com o Node.js próprio: saída $B (esperado 2)"; [ "$B" = "2" ] || S=1; [ -x node/bin/node ] || S=1
          echo "{\"licencaErrada\":$A,\"nodeProprio\":$B}" > r/arranque.json; exit $S
      - name: Arranque (Windows)
        if: always() && matrix.nome == 'windows'
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\p\proteja-se"
          set PROTEJASE_SEM_NAVEGADOR=1
          set LICENCA=AMS-errado
          call "Arrancar (Windows).bat"
          set A=%ERRORLEVEL%
          echo arranque com licenca errada: saida %A% (esperado 2)
          set PROTEJASE_NODE_PROPRIO=1
          call "Arrancar (Windows).bat"
          set B=%ERRORLEVEL%
          echo arranque com o Node.js proprio: saida %B% (esperado 2)
          set PROTEJASE_NODE_PROPRIO=
          echo S| call "Arrancar com o computador (Windows).bat"
          set C=0
          if exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\Proteja-se.lnk" set C=1
          echo atalho de arranque criado: %C% (esperado 1)
          echo {"licencaErrada":%A%,"nodeProprio":%B%,"atalho":%C%} > r\arranque.json
          if not "%A%"=="2" exit /b 1
          if not "%B%"=="2" exit /b 1
          if not "%C%"=="1" exit /b 1
      - name: Guardar os resultados
        if: always()
        run: |
          R="chave-${{ github.run_id }}-${{ matrix.nome }}"; mkdir -p "resultados/${{ matrix.nome }}"; cp "$RUNNER_TEMP"/p/proteja-se/r/*.json "$RUNNER_TEMP"/p/proteja-se/r/*.png "resultados/${{ matrix.nome }}/" 2>/dev/null || true
          git add resultados; git commit -q -m "resultados $R" || true; git push -q origin "$R" || true
